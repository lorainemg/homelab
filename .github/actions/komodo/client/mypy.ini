# Type-check the client and its tests. From this directory: `uvx mypy`
# (or `python3 -m mypy`), no arguments. test-actions.yml runs the same.
[mypy]
strict = True
files = komodo.py, cli.py, tests
# The tests put their own directory on sys.path at runtime so they can
# `import stub_komodo`; the checker never runs that line, so name it here.
mypy_path = tests
explicit_package_bases = True
