name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # rebuild-and-redeploy button (fresh server, changed agent)

permissions:
  contents: read
  packages: write

# Serialize runs: two builds racing to push :latest would leave GHCR holding
# whichever finished last, not whichever commit is newest.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Built-image stacks deploy through CI after their images are published.
  # Prebuilt-image stacks use direct GitHub webhooks. `config` needs ordering because
  # config-agent is a built image, and Komodo must not pull it until GHCR has
  # it: that ordering is what the trigger step at the bottom exists to enforce.
  build-config-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only the agent script lives in the image now. Caddyfile, HA yaml and
      # mosquitto.conf are mounted from Komodo's checkout, so editing them
      # doesn't rebuild anything and doesn't need CI at all.
      - uses: dorny/paths-filter@v3
        id: images
        with:
          filters: |
            config_agent:
              - 'config/config-agent/**'

      - uses: docker/login-action@v3
        if: github.event_name == 'workflow_dispatch' || steps.images.outputs.config_agent == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: github.event_name == 'workflow_dispatch' || steps.images.outputs.config_agent == 'true'
        with:
          context: .
          file: config/config-agent/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/config-agent:latest
            ghcr.io/${{ github.repository }}/config-agent:${{ github.sha }}

      # The image must exist in GHCR before Komodo pulls it. This step is what
      # closes the build/deploy race: same job, strictly after the build.
      #
      # The action waits for Komodo's Update to finish, so a green step here
      # means the stack actually came up -- unlike the webhook listener this
      # replaced, which returned 200 on acceptance and never reported back.
      - name: Tell Komodo to deploy config
        if: github.event_name == 'workflow_dispatch' || steps.images.outputs.config_agent == 'true'
        uses: ./.github/actions/komodo/deploy-stack
        with:
          komodo-url: ${{ secrets.KOMODO_URL }}
          api-key: ${{ secrets.KOMODO_API_KEY }}
          api-secret: ${{ secrets.KOMODO_API_SECRET }}
          stack: config

  # Komodo's Stacks are declared in komodo/stacks.toml, but Komodo never reads
  # that file itself. Its `links` field cannot reference a variable, so the
  # file is a template: this job fills in `${HOMELAB_LAN_IP}` from the `vars`
  # input below, pushes the result into the `homelab` ResourceSync as its
  # contents, runs the sync and waits for it. Chosen over committing a
  # rendered copy back to the repo so there is one stacks.toml in git.
  #
  # These jobs hold the Komodo API key of the `homelab-ci` service user, which
  # is Write on this sync and Execute on `config` and `t3-code` -- but the
  # sync defines every Stack, post_deploy commands included, so treat that key
  # as the most valuable secret in this repo.
  sync-komodo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: sync
        with:
          filters: |
            stacks:
              - 'komodo/stacks.toml'
              # The LAN IP is stated in the sync step below, so editing it is
              # editing this file -- which has to re-run the sync.
              - '.github/workflows/deploy.yml'

      - name: Render stacks.toml and apply it
        if: github.event_name == 'workflow_dispatch' || steps.sync.outputs.stacks == 'true'
        uses: ./.github/actions/komodo/run-sync
        with:
          komodo-url: ${{ secrets.KOMODO_URL }}
          api-key: ${{ secrets.KOMODO_API_KEY }}
          api-secret: ${{ secrets.KOMODO_API_SECRET }}
          sync: homelab
          contents-file: komodo/stacks.toml
          vars: HOMELAB_LAN_IP=172.20.3.194

  build-t3-code:
    needs: sync-komodo # Stack definitions land before an image deployment.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: images
        with:
          filters: |
            t3_code:
              - 't3-code/server/**'
              - 't3-code/catalog/**'
            t3_stack:
              - 't3-code/docker-compose.yml'
              - 't3-code/deploy.env'
      - uses: docker/login-action@v3
        if: github.event_name == 'workflow_dispatch' || steps.images.outputs.t3_code == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: github.event_name == 'workflow_dispatch' || steps.images.outputs.t3_code == 'true'
        with:
          context: t3-code/server
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/t3-code:latest
            ghcr.io/${{ github.repository }}/t3-code:${{ github.sha }}
      - name: Build catalog image
        uses: docker/build-push-action@v6
        if: github.event_name == 'workflow_dispatch' || steps.images.outputs.t3_code == 'true'
        with:
          context: t3-code/catalog
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/t3-code-catalog:latest
            ghcr.io/${{ github.repository }}/t3-code-catalog:${{ github.sha }}
      - name: Tell Komodo to deploy t3-code
        if: github.event_name == 'workflow_dispatch' || steps.images.outputs.t3_code == 'true' || steps.images.outputs.t3_stack == 'true'
        uses: ./.github/actions/komodo/deploy-stack
        with:
          komodo-url: ${{ secrets.KOMODO_URL }}
          api-key: ${{ secrets.KOMODO_API_KEY }}
          api-secret: ${{ secrets.KOMODO_API_SECRET }}
          stack: t3-code
