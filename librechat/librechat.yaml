# LibreChat application config, bind-mounted read-only at /app/librechat.yaml.
#
# Unlike every other app config in this repo, this file is NOT baked into an
# image and flowed through config-agent: Komodo already has this repo checked
# out to run the compose file next to it, so the file is mounted straight from
# the clone. Editing it is a commit — the webhook redeploys the stack.
#
# Schema reference: https://www.librechat.ai/docs/configuration/librechat_yaml

# Required. Matches the CONFIG_VERSION LibreChat v0.8.7 ships with; a newer
# app version may expect a newer value here.
version: 1.3.13
cache: true

endpoints:
  # Microsoft Foundry / Azure OpenAI. Only the key comes from the environment
  # (AZURE_API_KEY, set on the Komodo Stack) — everything else is committed,
  # which is the whole reason the key is referenced rather than inlined.
  azureOpenAI:
    # Conversation titles are generated by the cheap deployment rather than
    # whichever model the conversation itself uses.
    titleModel: "gpt-4o-mini"
    groups:
      - group: "foundry"
        # The resource name only, not a URL: LibreChat builds
        # https://<instanceName>.openai.azure.com from it. If the Foundry
        # resource is exposed on a different host (some are provisioned under
        # *.services.ai.azure.com or *.cognitiveservices.azure.com), drop
        # instanceName and set `baseURL` to the full endpoint instead.
        instanceName: "${AZURE_INSTANCE_NAME}"
        apiKey: "${AZURE_API_KEY}"
        # Azure's api-version, not the model version. A wrong value here shows
        # up as an empty model list in an otherwise healthy UI.
        version: "2024-10-21"
        # Keys are the model names shown in the picker; deploymentName is what
        # the model is actually called in the Foundry resource. They are
        # frequently not the same, and only the deployment name is authoritative
        # — check it in the Azure portal rather than assuming.
        models:
          gpt-4o:
            deploymentName: "gpt-4o"
          gpt-4o-mini:
            deploymentName: "gpt-4o-mini"

fileConfig:
  endpoints:
    azureOpenAI:
      # Images go straight to the vision model; Office and PDF files are parsed
      # by the rag_api container first (see the compose file).
      fileLimit: 10
      fileSizeLimit: 20 # MB
      totalSizeLimit: 50 # MB
  serverFileSizeLimit: 20
  avatarSizeLimit: 2
