# Deployed by Komodo from this repo on a GitHub webhook, not by CI. The Komodo
# Stack is named docker-registry and pins project_name to match, so compose
# reattaches to the existing docker-registry_registry-data volume.
services:
  registry:
    image: registry:2
    container_name: registry
    restart: unless-stopped
    ports:
      - 5000:5000
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_HTTP_RELATIVEURLS: "true"
    volumes:
      - registry-data:/var/lib/registry
    networks:
      - internal

volumes:
  registry-data:

networks:
  internal:
    external: true