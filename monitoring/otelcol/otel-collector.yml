receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlp/aspire:
    endpoint: env-dashboard:18889
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  debug:
    verbosity: basic

service:
  telemetry:
    metrics:
      # The collector's own metrics — queue depth, dropped spans, refused
      # batches. It binds these to container-local loopback by default, which
      # no other container can reach; host 0.0.0.0 is what makes the endpoint
      # visible to Prometheus. 0.160.0 removed the old `address:` key, so this
      # nested form is the only one that validates.
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlp/tempo, otlp/aspire, debug]
    logs:
      receivers: [otlp]
      exporters: [otlp/aspire, otlphttp/loki, debug]