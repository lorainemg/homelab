services:
  prometheus:
    # Upstream image; config comes from ./prometheus in the checkout beside
    # this file, mounted read-only.
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    # docker-entrypoint.sh is a plain 644 file in git, so it is run through sh
    # rather than executed. (The deleted Dockerfile used COPY --chmod=755.)
    entrypoint: ["/bin/sh", "/etc/prometheus/docker-entrypoint.sh"]
    ports:
      - "9090:9090"
    environment:
      - HA_TOKEN=${HA_TOKEN:-}
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    tmpfs:
      # The entrypoint writes the HA token here at startup. Deliberately
      # OUTSIDE the read-only ./prometheus mount: docker cannot create a
      # mountpoint inside a read-only bind mount, and a placeholder directory
      # could not be committed anyway because .gitignore has **/secrets/.
      # tmpfs also suits the data — the token is rewritten from HA_TOKEN on
      # every start, so it never persists and never touches disk.
      - /run/prometheus:uid=65534,gid=65534,mode=0700
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - internal

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /:/host:ro,rslave
    command:
      - '--path.rootfs=/host'
    networks:
      - internal

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - internal

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    volumes:
      - loki_data:/loki
    networks:
      - internal

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    volumes:
      - ./promtail:/etc/promtail:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/promtail.yml
    networks:
      - internal

  tempo:
    image: grafana/tempo:2.4.2
    container_name: tempo
    restart: unless-stopped
    command: -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./tempo:/etc/tempo:ro
      - tempo_data:/tmp/tempo
    networks:
      - internal

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel_collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/otel-collector.yml"]
    volumes:
      - ./otelcol:/etc/otelcol:ro
    networks:
      - internal
      # Joins the trakt bot's network so the collector can forward telemetry
      # to its Aspire dashboard.
      - trakt-tg-bot_aspire

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - internal

networks:
  internal:
    external: true
  trakt-tg-bot_aspire:
    external: true

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:
