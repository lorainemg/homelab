global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node_exporter:9100']

  - job_name: 'home-assistant'
    # Long-lived HA access token, kept out of git.
    # Create it in HA (profile -> Security -> Long-lived access tokens) and
    # set it as HA_TOKEN in monitoring/.env. The entrypoint writes it to the
    # path below, a tmpfs outside this read-only config mount.
    authorization:
      credentials_file: /run/prometheus/ha_token
    static_configs:
      - targets: ['homeassistant:8123']
    metrics_path: /api/prometheus

  - job_name: 'immich'
    static_configs:
      - targets: ['immich_server:8081']
    metrics_path: /metrics

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # The monitoring stack watching itself. Each of these ships a Prometheus
  # endpoint on 0.0.0.0 already, so they need no change on their side — only
  # a job here. Caddy and otel-collector are missing on purpose: both bind
  # their metrics port to localhost, so they need a config change first.
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']

  - job_name: 'promtail'
    static_configs:
      - targets: ['promtail:9080']

  # Not the admin API on 2019 — that can rewrite Caddy's running config, so it
  # stays bound to localhost. 2020 is the metrics-only site in config/caddy/Caddyfile.
  - job_name: 'caddy'
    static_configs:
      - targets: ['config-caddy:2020']

  # The collector's own health: refused batches, dropped spans, queue depth.
  # Needs the telemetry block in monitoring/otelcol/otel-collector.yml — the
  # port is loopback-only without it.
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel_collector:8888']

  # LibreChat serves /metrics but answers 401 unless METRICS_SECRET is set on
  # its side and sent as a bearer token from this side. The same value lives in
  # librechat/.env as METRICS_SECRET and in monitoring/.env as
  # LIBRECHAT_METRICS_SECRET; the entrypoint writes it to the path below.
  # Until both exist this target is simply DOWN — nothing else is affected.
  - job_name: 'librechat'
    authorization:
      credentials_file: /run/prometheus/librechat_metrics_token
    static_configs:
      - targets: ['librechat:3080']
