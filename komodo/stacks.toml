# Komodo Resource Sync — the control plane's own configuration, in git.
#
# Declares the Stack objects Komodo holds in MongoDB: which repo and path each
# one deploys, its compose project name, and its deploy behaviour. Without this
# file that layer exists only in the database and cannot be grepped, reviewed
# or rebuilt from the repo.
#
# This file is a template. `${HOMELAB_LAN_IP}` is filled in from
# komodo/vars.env by the sync job in .github/workflows/deploy.yml (and by
# scripts/bootstrap.sh on a fresh server), and the rendered TOML is pushed
# into the `homelab` sync, which holds it as contents instead of cloning this
# repo. So Komodo never reads this file directly, and a value that appears in
# many links is written once, in vars.env.
#
# Only non-default fields are declared. Komodo's sync diffs *declared* fields
# against the live config and cannot see the rest, so anything omitted here is
# left exactly as it is — not reset. That is deliberate:
#
#   - A resource DECLARED here must declare every one of its non-default
#     fields: sync merges the declared fields onto a *default* config and
#     applies the result, so an undeclared field on a declared resource is
#     reset, not preserved (bin/core/src/sync/view.rs in komodo v2.3.1,
#     "Makes sure things that aren't defined in toml ... actually get
#     removed"). Resources NOT declared at all are untouched while
#     `delete: false`.
#   - Which is why `trakt-tg-bot` is absent: its `file_contents` and
#     `environment` (secrets included) are written by that repo's own CI,
#     and any declaration here would wipe them on every sync. That CI also
#     creates the Stack itself on its first run (see the README).
#   - `branch = "main"`, `webhook_enabled = true`, `env_file_path = ".env"`
#     and `auto_pull = true` are Komodo defaults and stay implicit.
#   - `links` is what the Komodo UI shows as clickable URLs on the stack. Each
#     lists the public hostname first (Cloudflare tunnel -> Caddy -> container;
#     the hostname table lives in the tunnel's dashboard config, not here), then
#     the LAN address for every port the compose file publishes on the host.
#     No link means nothing is reachable from outside its own Docker network.
#     `links` is not one of the fields Komodo interpolates (lib/interpolate,
#     v2.3.1), which is why the address is rendered in before the push rather
#     than referenced as a Komodo variable.

[[server]]
name = "Local"
[server.config]
enabled = true

##

[[stack]]
name = "config"
[stack.config]
server = "Local"
project_name = "config"
repo = "lorainemg/homelab"
file_paths = ["config/docker-compose.yml"]
# Caddy hot-reloads the Caddyfile from the checkout, but a compose edit still
# has to land; force-deploy so a config-only push is never silently skipped.
webhook_force_deploy = true

##

[[stack]]
name = "docker-registry"
[stack.config]
server = "Local"
project_name = "docker-registry"
repo = "lorainemg/homelab"
file_paths = ["registry/docker-compose.yml"]
links = ["https://registry.sussman.win", "http://${HOMELAB_LAN_IP}:5000"]

##

[[stack]]
name = "home-assistant"
[stack.config]
server = "Local"
project_name = "home-assistant"
repo = "lorainemg/homelab"
file_paths = ["home-assistant/docker-compose.yml"]
links = ["https://homeassistant.sussman.win", "http://${HOMELAB_LAN_IP}:8123"]

##

[[stack]]
name = "immich"
[stack.config]
server = "Local"
project_name = "immich"
repo = "lorainemg/homelab"
file_paths = ["immich/docker-compose.yml"]
links = ["https://immich.sussman.win", "http://${HOMELAB_LAN_IP}:2283"]

##

[[stack]]
name = "librechat"
[stack.config]
server = "Local"
project_name = "librechat"
repo = "lorainemg/homelab"
file_paths = ["librechat/docker-compose.yml"]
links = ["https://librechat.sussman.win"]
# LibreChat reads its YAML once at boot, so a config-only commit needs both a
# forced deploy and a restart, or the API keeps serving the old config.
webhook_force_deploy = true
post_deploy.command = """
docker restart librechat
"""
post_deploy.shell_mode = false

##

[[stack]]
name = "monitoring"
[stack.config]
server = "Local"
project_name = "monitoring"
repo = "lorainemg/homelab"
file_paths = ["monitoring/docker-compose.yml"]
# Grafana is the only service here with a public hostname; Prometheus (9090)
# is LAN-only.
links = [
  "https://grafana.sussman.win",
  "http://${HOMELAB_LAN_IP}:3000",
  "http://${HOMELAB_LAN_IP}:9090",
]
# Same reason as librechat: these four read their config files at startup only.
webhook_force_deploy = true
post_deploy.command = """
docker restart prometheus promtail tempo otel_collector
"""
post_deploy.shell_mode = false
